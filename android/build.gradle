buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://maven.google.com" }
        maven { url 'https://react-native-community.github.io/maven/' }
        jcenter()  // Add JCenter as a fallback
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.0.2")
        classpath("com.facebook.react:react-native-gradle-plugin:0.71.0")  // Ensure this version is correct
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20")
    }
}
